name: QA

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 tests/check_repo.py
      - run: bash scripts/package_release.sh
      - run: unzip -t "dist/hvlisp-v$(cat VERSION).zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/CHECKSUMS.txt

  publish-assets:
    if: github.ref_type == 'tag'
    needs: static-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/package_release.sh
      - name: Create release or upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/CHECKSUMS.txt --clobber
